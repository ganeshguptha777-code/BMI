name: Deploy HealthMate to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Enable Web
        run: |
          flutter --version
          flutter config --enable-web

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          echo "Running code analysis..."
          flutter analyze --no-fatal-warnings || true

      - name: Determine GitHub Pages Base Href & Build
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Repository name: $REPO_NAME"
          
          # If the repository is a user/organization root site (ends with .github.io),
          # base-href is root "/". Otherwise it is "/<repo-name>/"
          if [[ "$REPO_NAME" == *".github.io"* ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO_NAME/"
          fi
          
          echo "Computed Base Href: $BASE_HREF"
          flutter build web --release --base-href "$BASE_HREF"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
